<footer class="footer page-width">
  <div class="footer__line"></div>
  <div class="footer__container">
    <div class="footer__legal legal-notice">
      <a
        routerLink="/"
        fragment="header"
        class="footer__logo brand-logo"
        aria-label="Ahmet"
      >
        <span class="brand-logo__start" aria-hidden="true"
          ><span class="brand-logo__a">A</span><span>h</span></span
        ><span aria-hidden="true">me</span
        ><span class="brand-logo__t" aria-hidden="true">t</span>
      </a>
      <div class="footer__legal-links">
        <a class="footer__legal-link" routerLink="/legal-notice">
          {{ text().legalNotice }}
        </a>
      </div>
    </div>
    <div class="footer__copyright copyright">©Ahmet Balci 2026</div>
    <div class="footer__social-links social-link">
      <a target="_blank" class="footer__social-link" href="">
        <img class="footer__social-icon" src="./assets/icon/hero/github-btn.svg" alt="" />
      </a>
      <a target="_blank" class="footer__social-link" href="">
        <img class="footer__social-icon" src="./assets/icon/hero/email-btn.svg" alt="" />
      </a>
      <a target="_blank" class="footer__social-link" href="">
        <img class="footer__social-icon" src="./assets/icon/hero/linkedin-btn.svg" alt="" />
      </a>
    </div>
  </div>
</footer>
