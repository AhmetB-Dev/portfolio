<header class="header">
  <div
    style="display: flex; align-items: center; justify-content: space-between"
    class="header__container page-width"
  >
    <a routerLink="/" fragment="header" class="header__logo logo">
      <span class="header__logo-main logo-main">Ahme</span><span class="header__logo-end logo-end">t</span>
    </a>
    <button
      class="header__menu-button mobile-menu-button"
      type="button"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
      (click)="toggleMobileMenu()"
    >
      <img class="header__menu-icon" [src]="menuIcon()" alt="" aria-hidden="true" />
    </button>

    <nav
      id="main-navigation"
      class="header__navigation"
      [class.is-open]="menuOpen()"
      [class.can-animate]="menuAnimation()"
      [class.header__navigation--open]="menuOpen()"
      [class.header__navigation--animating]="menuAnimation()"
    >
      <div class="header__menu-content menu-content">
        <ul class="header__navigation-list">
          <li class="header__navigation-item">
            <a
              class="header__navigation-link"
              routerLink="/"
              fragment="about"
              routerLinkActive="is-active header__navigation-link--active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              (click)="closeMobileMenu()"
            >
              {{ text().about }}
            </a>
          </li>

          <li class="header__navigation-item">
            <a
              class="header__navigation-link"
              routerLink="/"
              fragment="skills"
              routerLinkActive="is-active header__navigation-link--active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              (click)="closeMobileMenu()"
            >
              {{ text().skills }}
            </a>
          </li>

          <li class="header__navigation-item">
            <a
              class="header__navigation-link"
              routerLink="/"
              fragment="projects"
              routerLinkActive="is-active header__navigation-link--active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              (click)="closeMobileMenu()"
            >
              {{ text().portfolio }}
            </a>
          </li>

          <li class="header__navigation-item header__navigation-item--mobile-contact mobile-ct">
            <a
              class="header__navigation-link"
              routerLink="/"
              fragment="contact"
              routerLinkActive="is-active header__navigation-link--active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              (click)="closeMobileMenu()"
            >
              {{ text().contact }}
            </a>
          </li>
        </ul>

        <div class="header__language lang-container">
          @for (l of lang.supported; track l.code; let last = $last) {
            <button
              class="header__language-button"
              type="button"
              [class.is-active-lang]="lang.current() === l.code"
              [class.header__language-button--active]="lang.current() === l.code"
              (click)="lang.set(l.code)"
            >
              {{ l.short }}
            </button>

            @if (!last) {
              <span class="header__language-separator lang-separator">/</span>
            }
          }
        </div>
      </div>
    </nav>
  </div>
</header>
