<header class="header page-width" [class.header--menu-open]="menuOpen()">
  <div class="header__container">
    <a routerLink="/" fragment="hero" class="header__logo brand-logo" aria-label="Ahmet">
      <span class="brand-logo__start" aria-hidden="true"
        ><span class="brand-logo__a">A</span><span>h</span></span
      ><span aria-hidden="true">me</span><span class="brand-logo__t" aria-hidden="true">t</span>
    </a>
    <button
      class="header__menu-button"
      type="button"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
      (click)="toggleMobileMenu()"
    >
      <img class="header__menu-icon" [src]="menuIcon()" alt="" aria-hidden="true" />
    </button>

    <nav
      id="main-navigation"
      class="header__navigation"
      [class.header__navigation--open]="menuOpen()"
      [class.header__navigation--animating]="menuAnimation()"
    >
      <div class="header__menu-content">
        <ul class="header__navigation-list">
          <li class="header__navigation-item">
            <a
              class="header__navigation-link"
              routerLink="/"
              fragment="about"
              routerLinkActive="header__navigation-link--active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              (click)="closeMobileMenu()"
            >
              {{ text().about }}
            </a>
          </li>

          <li class="header__navigation-item">
            <a
              class="header__navigation-link"
              routerLink="/"
              fragment="skills"
              routerLinkActive="header__navigation-link--active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              (click)="closeMobileMenu()"
            >
              {{ text().skills }}
            </a>
          </li>

          <li class="header__navigation-item">
            <a
              class="header__navigation-link"
              routerLink="/"
              fragment="projects"
              routerLinkActive="header__navigation-link--active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              (click)="closeMobileMenu()"
            >
              {{ text().portfolio }}
            </a>
          </li>

          <li class="header__navigation-item header__navigation-item--mobile-contact">
            <a
              class="header__navigation-link"
              routerLink="/"
              fragment="contact"
              routerLinkActive="header__navigation-link--active"
              [routerLinkActiveOptions]="{
                paths: 'exact',
                queryParams: 'ignored',
                matrixParams: 'ignored',
                fragment: 'exact',
              }"
              (click)="closeMobileMenu()"
            >
              {{ text().contact }}
            </a>
          </li>
        </ul>

        <div class="header__language">
          @for (l of lang.supported; track l.code; let last = $last) {
            <button
              class="header__language-button"
              type="button"
              [class.header__language-button--active]="lang.current() === l.code"
              (click)="lang.set(l.code)"
            >
              {{ l.short }}
            </button>

            @if (!last) {
              <span class="header__language-separator">/</span>
            }
          }
        </div>
      </div>
    </nav>
  </div>
</header>
