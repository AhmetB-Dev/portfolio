<section class="stack-on-mobile">
  <div class="content-container">
    <h2>{{ text().title }}</h2>
    <div class="about-content">
      <div>
        <div>
          <p>{{ text().lead }}</p>
        </div>
        <div>
          <button>{{ text().contactCta }}</button>
        </div>
      </div>

      <div class="about">
        <div class="about-card">
          <img src="./assets/icon/about/location.svg" alt="" />
          <p>
            {{ text().cardLocation }}
          </p>
        </div>
        <div class="about-card">
          <img src="./assets/icon/about/puzzle-desktop.svg" alt="" />
          <h3>problem solving</h3>
          <p>{{ text().cardWorkStyle }}</p>
        </div>
        <div class="about-card">
          <img src="./assets/icon/about/bulb-desktop.svg" alt="" />
          <p>
            {{ text().cardLearning }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
