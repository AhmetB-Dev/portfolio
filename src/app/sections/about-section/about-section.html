<section id="about" class="about page-width">
  <div class="about__content">
    <h2 class="about__title" appReveal>
      {{ text().title }}
    </h2>

    <p class="about__lead" appReveal [revealDelay]="90">
      {{ text().lead }}
    </p>

    <div class="about__card" appReveal [revealDelay]="170">
      <img class="about__card-icon" src="assets/icon/about/location.svg" alt="" />

      <p class="about__card-text">
        {{ text().cardLocation }}
      </p>
    </div>

    <div class="about__card" appReveal [revealDelay]="250">
      <img class="about__card-icon" src="assets/icon/about/bulb.svg" alt="" />

      <p class="about__card-text">
        {{ text().cardLearning }}
      </p>
    </div>

    <div class="about__card" appReveal [revealDelay]="330">
      <img class="about__card-icon" src="assets/icon/about/puzzle.svg" alt="" />

      <p class="about__card-text">
        {{ text().cardProblemSolving }}
      </p>
    </div>
  </div>

  <div class="about__visual" appReveal revealFrom="right" [revealDelay]="130">
    <img class="about__portrait about__image-stack" src="assets/img/about/cover_me.webp" alt="" />
  </div>
</section>
