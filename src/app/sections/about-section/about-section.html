<section class="bg-stack-desktop ">
  <div class="about-content content-container ">
    <div class="mobile-flex dp-content">
      <div class="about">
        <h2>{{ text().title }}</h2>
        <p>{{ text().lead }}</p>
        <div class="about-card">
          <img src="./assets/icon/about/location.svg" alt="" />
          <p>
            {{ text().cardLocation }}
          </p>
        </div>
        <div class="about-card">
          <img src="./assets/icon/about/bulb.svg" alt="" />
          <p>
            {{ text().cardLearning }}
          </p>
        </div>
        <div class="about-card">
          <img src="./assets/icon/about/puzzle.svg" alt="" />
          <p>{{ text().cardWorkStyle }}</p>
        </div>
      </div>
    </div>

    <div class="bg-stack-mobile">
      <div class="cover-image image-stack">
        <img src="/assets/img/about/cover_me.png" alt="" />
      </div>
    </div>
  </div>
</section>
