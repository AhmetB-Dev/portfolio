<section class="hero page-width">
  <div class="hero__content">
    <p class="hero__subtitle-vert">{{ text().intro }}</p>
    <div class="hero__title-group">
      <h1 class="hero__title">Ahmet Balci</h1>
      <p class="hero__role">{{ text().role }}</p>
    </div>
  </div>

  <div class="hero__action">
    <a class="hero__cta" href="#contact ">{{ text().cta }}</a>
  </div>

  <div class="hero__meta">
    <div class="hero__social-content">
      <div class="hero__social-links">
        <a
          target="_blank"
          class="hero__social-link"
          href="https://github.com/AhmetB-Dev?tab=overview&from=2026-07-01&to=2026-07-21"
          ><img src="./assets/icon/hero/github-btn.svg" alt="Github Link"
        /></a>
        <a target="_blank" class="hero__social-link" href=""
          ><img src="./assets/icon/hero/email-btn.svg" alt="Email Link"
        /></a>
        <a target="_blank" class="hero__social-link" href=""
          ><img src="./assets/icon/hero/linkedin-btn.svg" alt="Linkedin Link"
        /></a>
      </div>
    </div>

    <div class="hero__scroll">
      <p class="hero__scroll-text">
        {{ text().scroll }} <img src="./assets/icon/hero/arrow-down-line.svg" alt="" />
      </p>
    </div>
  </div>
</section>
