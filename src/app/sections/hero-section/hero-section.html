<section class="hero page-width">
  <div class="hero__main">
    <div class="hero__content">
      <p class="hero__subtitle-vert">{{ text().intro }}</p>

      <div class="hero__title-group">
        <h1 class="hero__title">Ahmet Balci</h1>
        <p class="hero__role">{{ text().role }}</p>
      </div>
    </div>

    <div class="hero__action">
      <a class="hero__cta" href="#contact">
        {{ text().cta }}
      </a>
    </div>
  </div>

  <div class="hero__meta">
    <div class="hero__social-content">
      <div class="hero__social-links">
        <a
          class="hero__social-link"
          href="https://github.com/AhmetB-Dev?tab=overview&from=2026-07-01&to=2026-07-21"
          target="_blank"
        >
          <img src="./assets/icon/hero/github-btn.svg" alt="GitHub-Profil öffnen" />
        </a>

        <a class="hero__social-link" href="mailto:ahmet_ba@web.de">
          <img src="./assets/icon/hero/email-btn.svg" alt="E-Mail senden" />
        </a>

        <a
          class="hero__social-link"
          href="https://www.linkedin.com/in/a-b-845059425/"
          target="_blank"
        >
          <img src="./assets/icon/hero/linkedin-btn.svg" alt="LinkedIn-Profil öffnen" />
        </a>
      </div>
    </div>

    <div class="hero__scroll">
      <p class="hero__scroll-text">
        {{ text().scroll }}

        <img src="./assets/icon/hero/arrow-down-line.svg" alt="" />
      </p>
    </div>
  </div>
</section>
