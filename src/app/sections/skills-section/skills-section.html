<section class="skills page-width">
  <div class="skills__info">
    <div class="skills__heading">
      <div>
        <h2 class="skills__title">{{ text().title }}</h2>
      </div>
      <div>
        <span class="skills__title-line"></span>
      </div>
    </div>

    <p class="skills__lead">
      {{ text().lead }}
    </p>

    <div class="skills__extra">
      <h3 class="skills__extra-title">{{ text().otherSkillTitle }}</h3>

      <p class="skills__extra-text">
        {{ text().otherSkillText }}
      </p>
    </div>

    <div class="skills__action">
      <a class="skills__cta" href="#contact">
        {{ text().cta }}
      </a>
    </div>
  </div>

  <div class="skills__grid">
    @for (skill of skills; track skill.src) {
      <div class="skills__item">
        <img class="skills__icon" [src]="skill.src" [alt]="skill.name" loading="lazy" />

        <p class="skills__label">
          @for (line of skill.labelLines ?? [skill.name]; track line) {
            <span>{{ line }}</span>
          }
        </p>
      </div>
    }

    <div class="skills__item skills__item--learning">
      <button
        class="skills__learning-trigger"
        type="button"
        aria-describedby="continually-learning-details"
      >
        <span class="skills__learning-icon" aria-hidden="true">
          <img
            class="skills__learning-icon-image skills__learning-icon-image--blue"
            src="assets/icon/skills/continually-learningBlue.svg"
            alt=""
          />
          <img
            class="skills__learning-icon-image skills__learning-icon-image--violet"
            src="assets/icon/skills/continually-learningViolet.svg"
            alt=""
          />
          <img
            class="skills__learning-icon-image skills__learning-icon-image--white"
            src="assets/icon/skills/continually-learning.svg"
            alt=""
          />
        </span>

        <span class="skills__label skills__label--learning">
          <span>Continually</span>
          <span>learning</span>
        </span>

        <span
          class="skills__learning-popover"
          id="continually-learning-details"
          role="tooltip"
        >
          <span class="skills__learning-message">
            {{ text().learningInterest }}
          </span>

          <span class="skills__learning-technologies">
            <span class="skills__learning-technology">
              <img src="assets/icon/skills/react.svg" alt="" loading="lazy" />
              <span>React</span>
            </span>

            <span class="skills__learning-technology">
              <img src="assets/icon/skills/vueJs.svg" alt="" loading="lazy" />
              <span>Vue.js</span>
            </span>
          </span>
        </span>
      </button>
    </div>
  </div>
</section>
