<section>
  <div class="content-container page-width">
    <div class="skills-info">
      <div class="skills-heading">
        <h2>{{ text().title }}</h2>
        <span class="title-line"></span>
      </div>

      <p class="skills-lead">
        {{ text().lead }}
      </p>

      <div class="skills-extra">
        <h3>{{ text().otherSkillTitle }}</h3>

        <p>
          {{ text().otherSkillText }}
        </p>
      </div>

      <div class="skills-action">
        <a class="contact-btn" href="#contact">
          {{ text().cta }}
        </a>
      </div>
    </div>

    <div class="skills-icons">
      @for (skill of skills; track skill.src) {
        <div class="skills-grid">
          <img [src]="skill.src" [alt]="skill.name" class="skill-icon" loading="lazy" />
          <p class="skill-label">
            @for (line of skill.labelLines ?? [skill.name]; track line) {
              <span>{{ line }}</span>
            }
          </p>
        </div>
      }
    </div>
  </div>
</section>
