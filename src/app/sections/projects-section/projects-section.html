<section class="projects page-width">
  <div>
    <div class="projects__intro">
      <div class="projects__heading">
        <span class="projects__title-line" aria-hidden="true"></span>

        <h2 class="projects__title">
          {{ text().title }}
        </h2>
      </div>

      <div class="projects__intro-content">
        <p class="projects__lead">
          {{ text().lead }}
        </p>
      </div>
    </div>

    <div class="projects__list-container">
      <div class="projects__grid">
        @for (project of projects(); track project.id) {
          <article
            class="projects__card"
            [class.projects__card--active]="activeProjectId() === project.id"
            tabindex="0"
            (click)="activateProject(project.id, $event)"
          >
            <img class="projects__image" [src]="project.src" [alt]="project.name" />

            <div class="projects__overlay">
              <div class="projects__actions">
                <a
                  class="projects__button projects__button--live"
                  [href]="project.liveUrl"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  {{ text().liveBtn }}
                </a>

                <a
                  class="projects__button projects__button--github"
                  [href]="project.githubUrl"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  {{ text().githubBtn }}
                </a>
              </div>

              <div class="projects__details">
                <h3 class="projects__name">{{ project.name }}</h3>
                <p>{{ project.description }}</p>
                <span class="projects__technologies">{{ project.technologies }}</span>
              </div>
            </div>
          </article>
        }
      </div>
    </div>
  </div>
</section>
