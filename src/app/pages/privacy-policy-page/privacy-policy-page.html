<main class="privacy-page page-width">
  <header>
    <div class="privacy-page__back">
      <a routerLink="/" [attr.aria-label]="text().backLabel">
        <img class="privacy-page__back-link" src="assets/shared/back_button.svg" alt="" />
      </a>
    </div>

    <h1 class="privacy-page__title">
      <span class="privacy-page__title-line-left" aria-hidden="true"></span>

      <span class="privacy-page__title-text">
        {{ text().title }}
      </span>
    </h1>
  </header>

  <article class="privacy-page__container">
    <section class="privacy-page__section">
      <h2 class="privacy-page__section-title">{{ text().firstSectionTitle }}</h2>

      <p>
        {{ text().firstParagraph }}
      </p>
    </section>

    <section class="privacy-page__section">
      <h2 class="privacy-page__section-title">{{ text().secondSectionTitle }}</h2>

      <p>
        {{ text().secondParagraph }}
      </p>
    </section>
  </article>
</main>
